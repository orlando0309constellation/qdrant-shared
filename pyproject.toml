[project]
name = "qdrant-manager"
version = "0.1.0"
description = "Qdrant Cluster Manager - CLI and Desktop GUI for managing Qdrant distributed clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.15.4",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.16.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qdrant_distributed", "qdrant_distributed.cli", "qdrant_distributed.client", "qdrant_distributed.models", "qdrant_distributed.operations", "qdrant_distributed.services", "qdrant_distributed.interface", "qdrant_distributed.scripts"]
py-modules = ["main"]

[project.scripts]
qdrant-shard = "main:main"
qdrant-shard-gui = "qdrant_distributed.interface.launcher:main"
qdrant-scheduler = "qdrant_distributed.scripts.scheduler:main"
