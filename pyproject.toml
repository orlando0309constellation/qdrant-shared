[project]
name = "qdrant-manager"
version = "0.1.0"
description = "Qdrant Cluster Manager - CLI and Desktop GUI for managing Qdrant distributed clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.15.4",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.16.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
shard = "main:main"
gui = "qdrant_distributed.interface.launcher:main"
